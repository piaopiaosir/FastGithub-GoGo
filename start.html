<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FastGithub-GoGo · 启动页</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #e9f1ff, #f7f9fc 60%, #f3f6fa);
    color: #0f172a;
  }
  .card {
    width: min(92vw, 520px); background: #fff; border: 1px solid #e6ebf2; border-radius: 18px;
    padding: 22px; box-shadow: 0 20px 50px -22px rgba(15, 23, 42, .35);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px; background: #fff; border: 1px solid #e6ebf2;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  h1 { font-size: 16px; margin: 0; }
  .sub { color: #64748b; font-size: 12px; margin: 6px 0 16px; }
  .status {
    display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 8px 10px;
    border-radius: 10px; background: #f6f8fb; border: 1px solid #e9eef5; margin-bottom: 14px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; flex: none; }
  .dot.ok { background: #16a34a; }
  .dot.bad { background: #dc2626; }
  .dot.wait { background: #d97706; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  input {
    width: 100%; height: 38px; padding: 0 12px; border: 1px solid #dbe2ec; border-radius: 10px;
    font: inherit; outline: none; background: #fff; color: inherit;
  }
  input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto; min-height: 38px; padding: 0 14px; border: 1px solid #dbe2ec; border-radius: 10px;
    background: #fff; color: #334155; font: inherit; cursor: pointer; transition: background .15s;
  }
  button:hover { background: #f6f8fb; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  .hint { color: #94a3b8; font-size: 11.5px; margin: 14px 0 0; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo">🐱</div>
    <h1>FastGithub-GoGo 启动页</h1>
  </div>
  <p class="sub">GitHub 打不开的时候，从这个本地页面跳过去。</p>

  <div class="status"><span class="dot wait" id="dot"></span><span id="status">正在检测 GitHub…</span></div>

  <input id="path" placeholder="仓库或路径，如 piaopiaosir/FastGithub-GoGo（可留空）">

  <div class="row">
    <button class="primary" id="auto">自动选择并打开</button>
  </div>
  <div class="row" id="mirrors"></div>

  <p class="hint">建议把这个文件拖进书签栏，或设成浏览器起始页。镜像列表与用户脚本里内置的一致。</p>
</div>

<script>
(function () {
  var GITHUB = "https://github.com";
  var MIRRORS = [
    { name: "github.gohj99.site", base: "https://github.gohj99.site" },
    { name: "6github.com", base: "https://6github.com" }
  ];
  var STORE_KEY = "ghg.start.last";
  var dot = document.getElementById("dot");
  var statusText = document.getElementById("status");
  var pathInput = document.getElementById("path");
  var reachable = null;

  function readLast() {
    try { return localStorage.getItem(STORE_KEY) || ""; } catch (error) { return ""; }
  }
  function writeLast(value) {
    try { localStorage.setItem(STORE_KEY, value); } catch (error) { /* 忽略 */ }
  }

  function buildTarget(base, value) {
    var raw = String(value || "").trim();
    if (!raw) return base;
    if (raw.indexOf("http://") === 0 || raw.indexOf("https://") === 0) {
      return raw.replace(/^https?:\/\/(www\.)?github\.com/i, base);
    }
    return base.replace(/\/+$/, "") + "/" + raw.replace(/^\/+/, "");
  }

  function go(url) {
    writeLast(url);
    window.location.href = url;
  }

  function setStatus(tone, text) {
    dot.className = "dot " + tone;
    statusText.textContent = text;
  }

  function probe() {
    var done = false;
    var image = new Image();
    var timer = setTimeout(function () { finish(false); }, 3500);
    function finish(ok) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      reachable = ok;
      setStatus(ok ? "ok" : "bad", ok ? "GitHub 可访问（约 " + elapsed + " ms）" : "GitHub 不可访问，建议走镜像");
      document.getElementById("auto").textContent = ok ? "打开 GitHub" : "打开最快镜像";
    }
    var start = Date.now();
    var elapsed = 0;
    image.onload = function () { elapsed = Date.now() - start; finish(true); };
    image.onerror = function () { finish(false); };
    image.src = GITHUB + "/favicon.ico?t=" + Date.now();
  }

  function renderMirrors() {
    var box = document.getElementById("mirrors");
    MIRRORS.forEach(function (mirror) {
      var button = document.createElement("button");
      button.textContent = mirror.name;
      button.addEventListener("click", function () {
        go(buildTarget(mirror.base, pathInput.value));
      });
      box.appendChild(button);
    });
  }

  document.getElementById("auto").addEventListener("click", function () {
    if (reachable === true) {
      go(buildTarget(GITHUB, pathInput.value));
      return;
    }
    go(buildTarget(MIRRORS[0].base, pathInput.value));
  });

  var last = readLast();
  if (last && last.indexOf(GITHUB) === 0) {
    pathInput.value = last.slice(GITHUB.length).replace(/^\/+/, "");
  }
  renderMirrors();
  probe();
})();
</script>
</body>
</html>
